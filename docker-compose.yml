version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: crypto_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - crypto_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.25-alpine
    container_name: crypto_nginx
    restart: unless-stopped
    ports:
      - "${FORWARD_NGINX_PORT:-8000}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - crypto_net
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: crypto_postgres
    restart: unless-stopped
    networks:
      - crypto_net
    environment:
      POSTGRES_DB: ${DB_DATABASE:-crypto_alerts}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${FORWARD_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-crypto_alerts}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: crypto_redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    networks:
      - crypto_net
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  queue-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: crypto_queue_worker
    restart: unless-stopped
    networks:
      - crypto_net
    volumes:
      - .:/var/www/html
    command: php /var/www/html/artisan queue:work --sleep=3 --tries=3 --timeout=90
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

networks:
  crypto_net:
    driver: bridge